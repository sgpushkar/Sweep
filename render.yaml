services:
  - type: web
    name: sweep-site
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /releases/*
        destination: /releases/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /releases/*.apk
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /releases/*.apk
        name: Content-Disposition
        value: attachment; filename="WhatsAppMediaCleaner.apk"
